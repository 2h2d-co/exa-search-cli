name: Live API integration

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: live-api-integration
  cancel-in-progress: false

jobs:
  integration:
    name: Test packed CLI against Exa API
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: api-integration
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js and npm
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: "2026.10.3"
          install_args: --locked
          cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check
        run: hk check --all --check

      - name: Test all CLI behavior and the packed artifact against the real API
        run: npm run test:integration
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
